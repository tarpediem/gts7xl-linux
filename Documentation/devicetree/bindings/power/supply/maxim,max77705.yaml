%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/maxim,max77705.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim MAX777705 charger

maintainers:
  - Dzmitry Sankouski <dsankouski@gmail.com>

description: |
  This is a device tree bindings for charger found in Maxim MAX77705 chip.

allOf:
  - $ref: power-supply.yaml#

properties:
  compatible:
    const: maxim,max77705-charger

  interrupts:
    maxItems: 1

  reg:
    maxItems: 1

  io-channels:
    maxItems: 1
    description:
      Battery thermistor. When given, the driver enables charging only while
      the temperature is inside the alert-celsius range of the monitored
      battery (2 C hysteresis), runs the safety timer and keeps the charger
      watchdog enabled and kicked.

  io-channel-names:
    const: battery-temp

  input-current-limit-microamp:
    description: Upper limit of the CHGIN input current.

  maxim,dcp-input-current-limit-microamp:
    description:
      With the battery thermistor, input limit used only while the USB-C
      block's BC1.2 detection reports a dedicated charging port (DCP);
      every other cable, or an unreadable status, gets
      input-current-limit-microamp.

  maxim,typec-1500ma-input-current-limit-microamp:
    description:
      With the battery thermistor and DCP detection, input limit used while
      the USB-C block reports the tablet as the sink of a source advertising
      1.5 A (Type-C Rp); the larger of this and the BC1.2 value applies.
    maximum: 1400000

  maxim,typec-3000ma-input-current-limit-microamp:
    description:
      As maxim,typec-1500ma-input-current-limit-microamp, for a source
      advertising 3.0 A.
    maximum: 3000000

  usb-role-switch:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      USB role switch (the USB controller) to set from the USB-C block's
      attach state: host while a sink is attached, device otherwise. With
      it, the charger can also supply VBUS (OTG boost, 900 mA) to an
      attached sink, off until enabled from userspace.

  maxim,otg-min-capacity-percent:
    description:
      No VBUS output below this battery capacity.
    minimum: 5
    maximum: 100
    default: 15

  maxim,dcp-constant-charge-current-microamp:
    description:
      With the battery thermistor and DCP detection, charge current used
      only while a dedicated charging port is detected; every other cable,
      or an unreadable status, gets the battery's
      constant-charge-current-max-microamp.
    maximum: 1500000

  maxim,safety-timer-sec:
    description:
      With the battery thermistor, stop charging after this much charging
      time since the input was plugged in. 0 or absent disables the timer.

dependencies:
  io-channel-names: [ io-channels ]
  maxim,safety-timer-sec: [ io-channels ]
  maxim,dcp-input-current-limit-microamp: [ io-channels, input-current-limit-microamp ]
  maxim,dcp-constant-charge-current-microamp: [ maxim,dcp-input-current-limit-microamp ]
  maxim,typec-1500ma-input-current-limit-microamp: [ maxim,dcp-input-current-limit-microamp ]
  maxim,typec-3000ma-input-current-limit-microamp: [ maxim,dcp-input-current-limit-microamp ]
  usb-role-switch: [ maxim,dcp-input-current-limit-microamp ]
  maxim,otg-min-capacity-percent: [ usb-role-switch ]

required:
  - compatible
  - reg
  - monitored-battery

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        charger@69 {
            compatible = "maxim,max77705-charger";
            reg = <0x69>;
            monitored-battery = <&battery>;
            interrupt-parent = <&pm8998_gpios>;
            interrupts = <11 IRQ_TYPE_LEVEL_LOW>;
        };
    };
